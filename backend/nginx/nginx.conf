user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 20;
  types_hash_max_size 2048;
  client_max_body_size 1m;
  autoindex off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for","method":"$request_method","host":"$host","uri":"$uri","status":$status,"bytes_sent":$bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent","request_time":$request_time}';
  access_log /var/log/nginx/access.log json_combined;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=global_api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=admin_api:10m rate=20r/m;

  upstream backend_app {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  map $request_uri $is_blocked_path {
    default 0;
    ~^/\. 1;
    ~^/\.env 1;
    ~^/\.git 1;
    ~^/node_modules 1;
    ~^/logs 1;
    ~^/config 1;
    ~^/wp-admin 1;
    ~^/phpmyadmin 1;
    ~^/backup 1;
    ~^/old 1;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name api.store.example admin.api.store.example;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.store.example;

    ssl_certificate /etc/letsencrypt/live/api.store.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.store.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    if ($is_blocked_path = 1) {
      return 404;
    }

    location = /__trap_internal_probe {
      return 404;
    }

    location / {
      limit_req zone=global_api burst=20 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://backend_app;
      proxy_read_timeout 60s;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.api.store.example;

    ssl_certificate /etc/letsencrypt/live/admin.api.store.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.api.store.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    if ($is_blocked_path = 1) {
      return 404;
    }

    location = / {
      return 404;
    }

    location ^~ /a9e1f4c89b7d61a3 {
      limit_req zone=admin_api burst=5 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://backend_app;
      proxy_read_timeout 60s;
    }

    location / {
      return 404;
    }
  }
}
